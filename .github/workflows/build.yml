# Builds Windows, macOS and Linux downloads on version tags (a draft release) or by hand.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-14            # Apple Silicon
            name: macos-arm64
          - os: macos-15-intel      # Intel
            name: macos-intel
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Tests (the ones that need the game skip themselves)
        run: python -m unittest discover tests -v
      - name: Build
        shell: bash
        run: |
          python -m pip install pyinstaller
          if [ "$RUNNER_OS" != "Linux" ]; then python -m pip install pywebview; fi
          python -m PyInstaller --noconfirm packaging/celleditor.spec
      - name: Package
        shell: bash
        run: |
          VERSION=$(python -c "import celleditor; print(celleditor.__version__)")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match the version in celleditor/__init__.py ($VERSION)"
            exit 1
          fi
          OUT="OpenMW-Cell-Editor-$VERSION-${{ matrix.name }}.zip"
          cp README.md LICENSE dist/
          cd dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent "OpenMW Cell Editor.app" "../$OUT"
            zip -j "../$OUT" README.md LICENSE
          elif [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../$OUT" "OpenMW Cell Editor" README.md LICENSE
          else
            zip -r "../$OUT" "OpenMW Cell Editor" README.md LICENSE
          fi
          echo "ZIP=$OUT" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v5
        with:
          name: OpenMW-Cell-Editor-${{ matrix.name }}
          path: ${{ env.ZIP }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: downloads
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: downloads/*.zip
          draft: true
